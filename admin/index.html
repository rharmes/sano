<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Sano · admin</title>
		<meta name="robots" content="noindex,nofollow" />
		<meta name="color-scheme" content="light dark" />

		<!-- Standalone admin dashboard (served at /admin/). Reuses the app's fonts, tokens,
		     and components (css/sano.css) so it matches the brand; gated server-side by the
		     admin endpoints. Shared assets are absolute URLs so tools/stamp-version.mjs can
		     stamp them the same way it stamps index.html. -->
		<link rel="preload" href="/fonts/neuton-latin-700.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/lato-latin-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/css/fonts.css?v=370d668b" />
		<link rel="stylesheet" href="/css/normalize.css?v=144638bb" />
		<link rel="stylesheet" href="/css/barebones.css?v=406ae0d7" />
		<link rel="stylesheet" href="/css/sano.css?v=3c735bfe" />
		<link rel="stylesheet" href="/css/admin.css?v=479d511d" />
		<link rel="icon" href="/favicon.svg?v=e1facae9" type="image/svg+xml" />
		<meta name="theme-color" content="#fbf5e9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1b1822" media="(prefers-color-scheme: dark)" />

		<script src="/js/data.js?v=1840cbd4" defer></script>
		<script src="/js/admin.js?v=2c961ef1" defer></script>
	</head>
	<body>
		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<defs>
				<!-- Material Icons glyphs inlined as symbols (Apache 2.0, google/material-design-icons).
				     index.html's sprite is a separate document, so this page carries its own. -->
				<symbol id="ai-key" viewBox="0 0 24 24">
					<path
						d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"
					/>
				</symbol>
				<symbol id="ai-delete" viewBox="0 0 24 24">
					<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
				</symbol>
				<symbol id="ai-sort" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z" /></symbol>
				<symbol id="ai-bolt" viewBox="0 0 24 24">
					<path
						d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"
					/>
				</symbol>
			</defs>
		</svg>

		<main class="admin-main">
			<header class="admin-head">
				<h1 class="admin-title">Sano · users</h1>
				<a class="admin-back" href="/">← Back to app</a>
			</header>
			<p id="admin-status" class="admin-status" aria-live="polite"></p>
			<div id="admin-content"></div>
		</main>

		<dialog id="admin-reset-dialog" class="panel admin-dialog" aria-labelledby="admin-reset-title">
			<h2 id="admin-reset-title" class="admin-dialog-title">Reset password</h2>
			<form id="admin-reset-form" method="dialog">
				<label class="admin-field-label" for="admin-reset-password">New password</label>
				<input type="password" id="admin-reset-password" class="field" autocomplete="new-password" minlength="8" />
				<p id="admin-reset-error" class="admin-dialog-error hide"></p>
				<div class="admin-dialog-actions">
					<button type="button" class="btn-secondary" data-admin-cancel>Cancel</button>
					<button type="submit" class="btn-primary">Reset password</button>
				</div>
			</form>
		</dialog>

		<dialog id="admin-delete-dialog" class="panel admin-dialog" aria-labelledby="admin-delete-title">
			<h2 id="admin-delete-title" class="admin-dialog-title">Delete user?</h2>
			<p id="admin-delete-body" class="admin-dialog-text"></p>
			<p id="admin-delete-error" class="admin-dialog-error hide"></p>
			<div class="admin-dialog-actions">
				<button type="button" class="btn-secondary" data-admin-cancel>Cancel</button>
				<button type="button" id="admin-delete-confirm" class="btn-primary">Delete</button>
			</div>
		</dialog>
	</body>
</html>
