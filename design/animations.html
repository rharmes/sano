<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sano — Animation Tuner</title>
		<link rel="stylesheet" href="../css/fonts.css" />
		<style>
			/* Warm "paper" palette matching design/characters.html so all eleven
			   characters render on the tones they were drawn for. Light by default; the
			   top-bar toggle adds .dark on <html> to mirror the app's dark mode
			   (css/sano.css). The --f-* animal fills are light-only (as in
			   characters.html); Sano, the shipped mascot, recolors via the brand tokens. */
			:root {
				/* dev-tool chrome */
				--ink: #2a2630;
				--ink-soft: #837b8e;
				--ink-softer: #c8c1d2;
				--paper: #fafaf6;
				--paper-deep: #f0eee6;
				--indigo: #4c5896;
				--gold: #c8a04a;

				/* brand + paper-cut palette (ported from characters.html / sano.css) */
				--accent: #dd6470; /* crimson */
				--path-complete-color: #56629e; /* indigo (f-indigo) */
				--paper-petal: #f3c7cd;
				--paper-cream: #f1e8d6;
				--paper-cream-deep: #e8ddc6;
				--paper-ink: #37323c;
				--paper-whisker: #a59a86;
				--badge-color: #d99e3a;
				--background-color: #fbf5e9; /* warm paper for character tiles */

				/* animal fills */
				--f-rust: #c66a38;
				--f-rust-deep: #a9522a;
				--f-orange: #d98a43;
				--f-slate: #a4abb8;
				--f-slate-deep: #717a8d;
				--f-ele: #ad9ca7;
				--f-ele-deep: #6f5f6a;
				--f-rhino: #8e8b72;
				--f-rhino-deep: #5d5b46;
				--f-brown: #8c6a45;
				--f-brown-deep: #674a2e;
				--f-olive: #7f8a52;
				--f-olive-deep: #5d6740;
				--f-teal: #3f8f8a;
				--f-copper: #c0703f;
				--f-green: #708f4a;
				--f-snow: #f6efe2;
				--f-charcoal: #3a3540;
				--f-horn: #c2b48f;
				--f-bill: #5e6474; /* danphe beak + legs */
				--f-tooth: #d6ccad; /* gharial teeth + claws */
			}
			:root.dark {
				/* dev-tool chrome */
				--ink: #f3eff5;
				--ink-soft: #948b9e;
				--ink-softer: #463f52;
				--paper: #15131a;
				--paper-deep: #1f1d26;
				--indigo: #7d8dd2;
				--gold: #d6b35a;

				/* brand + paper-cut palette — mirrors css/sano.css dark mode */
				--accent: #e0697a;
				--path-complete-color: #7384c4;
				--paper-petal: #f0bfc7;
				--paper-cream: #e6dac4;
				--paper-cream-deep: #d6c9ae;
				--paper-ink: #2e2935;
				--paper-whisker: #8d8474;
				--badge-color: #d9aa4e;
				--background-color: #1b1822; /* dark warm paper for tiles */
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 2.4rem 2.4rem 4rem;
				font-family: 'Lato', sans-serif;
				font-weight: 300;
				color: var(--ink);
				background: var(--paper);
				min-height: 100vh;
			}

			/* Top bar — head thumbnails (Sano first) with the theme toggle on the right. */
			.topbar {
				display: flex;
				align-items: flex-start;
				gap: 1rem;
				max-width: 1100px;
				margin: 0 auto 2rem;
			}
			.char-picker {
				flex: 1;
				display: flex;
				flex-wrap: wrap;
				gap: 0.6rem;
				justify-content: center;
			}
			/* Chips and the theme toggle share one square, head-sized shape. */
			.char-picker button,
			.theme-toggle {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.2rem;
				width: 76px;
				padding: 0.4rem 0.2rem 0.3rem;
				background: var(--background-color);
				border: 1px solid var(--ink-softer);
				border-radius: 8px;
				cursor: pointer;
				transition:
					border-color 0.15s ease,
					transform 0.1s ease;
			}
			.theme-toggle {
				flex: none;
			}
			.char-picker button:hover,
			.theme-toggle:hover {
				transform: translateY(-2px);
			}
			.char-picker button.active {
				border-color: var(--accent);
				box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
			}
			.chip-art {
				width: 48px;
				height: 48px;
				display: grid;
				place-items: center;
			}
			.chip-art svg {
				width: 100%;
				height: 100%;
				display: block;
			}
			/* The sun/moon glyph reads a touch smaller than the character heads. */
			.theme-toggle .chip-art svg {
				width: 70%;
				height: 70%;
			}
			.chip-name {
				font-size: 0.66rem;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--ink-soft);
			}
			.char-picker button.active .chip-name {
				color: var(--accent);
			}

			.layout {
				display: grid;
				grid-template-columns: minmax(260px, 340px) 1fr;
				gap: 3rem;
				align-items: start;
				max-width: 1100px;
				margin: 0 auto;
			}
			.mascot-stage {
				position: sticky;
				top: 1.5rem;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}
			.stage-view {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.4rem;
			}
			.tile {
				width: 100%;
				background: var(--background-color);
				border: 1px solid var(--ink-softer);
				border-radius: 8px;
				aspect-ratio: 1;
				display: grid;
				place-items: center;
				padding: 7%;
			}
			.tile svg {
				width: 100%;
				height: 100%;
				display: block;
			}
			.stage-view figcaption {
				font-size: 0.7rem;
				font-weight: 700;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--ink-soft);
			}

			/* Whole SVG (body-wiggle / excited-jump) pivots at the feet. */
			.part-body {
				transform-origin: 50% 100%;
			}
			/* Per-part pivots — fill-box keeps the origin local to each part's own
			   bbox, so the same rule works for every character. */
			.part-head {
				transform-box: fill-box;
				transform-origin: 50% 100%;
			}
			.part-tail {
				transform-box: fill-box;
				transform-origin: 0% 50%;
			}
			.part-eyes {
				transform-box: fill-box;
				transform-origin: 50% 50%;
			}
			.part-ear {
				transform-box: fill-box;
				transform-origin: 50% 100%;
			}
			/* Mirror the wiggle direction so paired ears twitch outward symmetrically. */
			.part-ear-left {
				--ear-dir: 1;
			}
			.part-ear-right {
				--ear-dir: -1;
			}
			.part-nose {
				transform-box: fill-box;
				transform-origin: 50% 30%;
			}

			.controls {
				display: flex;
				flex-direction: column;
				gap: 1.4rem;
			}
			.controls .global {
				display: flex;
				gap: 0.8rem;
				flex-wrap: wrap;
			}
			#cards {
				display: flex;
				flex-direction: column;
				gap: 1.4rem;
			}
			.section-header {
				font-family: 'Lato', sans-serif;
				font-weight: 700;
				font-size: 0.78rem;
				letter-spacing: 0.32em;
				text-transform: uppercase;
				color: var(--ink-soft);
				margin: 1.4rem 0 -0.4rem;
				padding-bottom: 0.6rem;
				border-bottom: 1px solid var(--ink-softer);
			}
			.section-header:first-child {
				margin-top: 0;
			}
			.card {
				padding: 1.4rem 1.6rem;
				background: var(--paper-deep);
				border: 1px solid var(--ink-softer);
				border-radius: 6px;
			}
			.card h2 {
				font-family: 'Neuton', serif;
				font-weight: 700;
				font-size: 1.4rem;
				margin: 0 0 0.4rem;
				color: var(--ink);
			}
			.card .desc {
				font-family: 'Lato', sans-serif;
				font-size: 0.92rem;
				font-style: italic;
				color: var(--ink-soft);
				margin: 0 0 1rem;
			}
			.fields {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.8rem;
				margin-bottom: 1rem;
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: 0.25rem;
			}
			.field label {
				font-family: 'Lato', sans-serif;
				font-weight: 700;
				font-size: 0.7rem;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: var(--ink-soft);
			}
			.field input {
				font-family: 'Lato', sans-serif;
				font-size: 1rem;
				padding: 0.4rem 0.6rem;
				background: var(--paper);
				border: 1px solid var(--ink-softer);
				border-radius: 4px;
				color: var(--ink);
				width: 100%;
			}
			.field input:focus {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.row {
				display: flex;
				gap: 0.8rem;
				align-items: center;
				flex-wrap: wrap;
			}
			button.play {
				padding: 0.5rem 1.2rem;
				background: var(--accent);
				color: white;
				border: 0;
				border-radius: 4px;
				font-family: 'Lato', sans-serif;
				font-weight: 700;
				font-size: 0.95rem;
				cursor: pointer;
				transition: background 0.15s ease;
			}
			button.play:hover {
				background: color-mix(in srgb, var(--accent) 80%, black 20%);
			}
			button.stop {
				padding: 0.5rem 1.2rem;
				background: transparent;
				color: var(--ink);
				border: 1px solid var(--ink-softer);
				border-radius: 4px;
				font-family: 'Lato', sans-serif;
				font-weight: 700;
				font-size: 0.95rem;
				cursor: pointer;
			}
			button.stop:hover {
				background: var(--paper);
			}
			.loop-toggle {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				font-family: 'Lato', sans-serif;
				font-size: 0.92rem;
				color: var(--ink-soft);
				cursor: pointer;
				user-select: none;
			}
			.loop-toggle input {
				accent-color: var(--indigo);
				width: 1.1rem;
				height: 1.1rem;
			}
			.loop-toggle.active {
				color: var(--indigo);
				font-weight: 700;
			}
			.css-snippet {
				margin-top: 1rem;
				padding: 0.7rem 0.8rem;
				background: var(--paper);
				border: 1px dashed var(--ink-softer);
				border-radius: 4px;
				font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
				font-size: 0.78rem;
				color: var(--ink-soft);
				white-space: pre-wrap;
				word-break: break-all;
			}
			@media (max-width: 720px) {
				.layout {
					grid-template-columns: 1fr;
				}
				.mascot-stage {
					position: relative;
					top: 0;
					flex-direction: row;
					flex-wrap: wrap;
					justify-content: center;
				}
				.stage-view {
					width: 220px;
				}
				.fields {
					grid-template-columns: 1fr 1fr;
				}
			}

			/* Animation keyframes — JS calls them by name. The geometry of each
			   wiggle is locked here; only timing knobs are exposed in the UI. */
			@keyframes tail-wag {
				0%,
				100% {
					transform: rotate(0deg);
				}
				20% {
					transform: rotate(-22deg);
				}
				40% {
					transform: rotate(18deg);
				}
				60% {
					transform: rotate(-14deg);
				}
				80% {
					transform: rotate(10deg);
				}
			}
			@keyframes head-shake {
				0%,
				100% {
					transform: rotate(0deg);
				}
				22% {
					transform: rotate(-9deg);
				}
				54% {
					transform: rotate(9deg);
				}
				82% {
					transform: rotate(-4deg);
				}
			}
			@keyframes body-wiggle {
				0%,
				100% {
					transform: rotate(0deg);
				}
				22% {
					transform: rotate(-3deg);
				}
				54% {
					transform: rotate(2.4deg);
				}
				82% {
					transform: rotate(-1deg);
				}
			}
			@keyframes excited-jump {
				0% {
					transform: translateY(0) scaleY(1);
				}
				12% {
					transform: translateY(2px) scaleY(0.9);
				}
				32% {
					transform: translateY(-26px) scaleY(1.05);
				}
				52% {
					transform: translateY(0) scaleY(0.95);
				}
				68% {
					transform: translateY(-14px) scaleY(1.02);
				}
				86% {
					transform: translateY(0) scaleY(0.97);
				}
				100% {
					transform: translateY(0) scaleY(1);
				}
			}
			@keyframes little-bow {
				0%,
				100% {
					transform: translateY(0) scaleY(1) rotate(0deg);
				}
				40% {
					transform: translateY(8px) scaleY(0.82) rotate(0deg);
				}
				60% {
					transform: translateY(8px) scaleY(0.82) rotate(0deg);
				}
			}
			@keyframes eye-blink {
				0%,
				45%,
				60%,
				100% {
					transform: scaleY(1);
				}
				50%,
				55% {
					transform: scaleY(0.06);
				}
			}
			/* Each ear uses --ear-dir (+1 left / -1 right) to mirror its rotation
			   so the two ears twitch outward in sync. */
			@keyframes ear-wiggle {
				0%,
				100% {
					transform: rotate(0deg);
				}
				25% {
					transform: rotate(calc(var(--ear-dir, 1) * -12deg));
				}
				55% {
					transform: rotate(calc(var(--ear-dir, 1) * 10deg));
				}
				80% {
					transform: rotate(calc(var(--ear-dir, 1) * -5deg));
				}
			}
			@keyframes nose-wiggle {
				0%,
				100% {
					transform: rotate(0deg) translateX(0);
				}
				20% {
					transform: rotate(-4deg) translateX(-0.8px);
				}
				40% {
					transform: rotate(4deg) translateX(0.8px);
				}
				60% {
					transform: rotate(-3deg) translateX(-0.5px);
				}
				80% {
					transform: rotate(3deg) translateX(0.5px);
				}
			}
			/* Tilt in (0 → 10%), hold (10 → 90%), tilt back (90 → 100%).
			   At the default 3800ms duration this gives a 380ms ramp + 3s hold + 380ms return. */
			@keyframes head-tilt {
				0%,
				100% {
					transform: rotate(0deg);
				}
				10%,
				90% {
					transform: rotate(-12deg);
				}
			}

			/* Paper-cut fills — Sano + companions share this set. */
			.f-indigo {
				fill: var(--path-complete-color);
			}
			.f-crimson {
				fill: var(--accent);
			}
			.f-petal {
				fill: var(--paper-petal);
			}
			.f-cream {
				fill: var(--paper-cream);
			}
			.f-cream-deep {
				fill: var(--paper-cream-deep);
			}
			.f-ink {
				fill: var(--paper-ink);
			}
			.f-rust {
				fill: var(--f-rust);
			}
			.f-rust-deep {
				fill: var(--f-rust-deep);
			}
			.f-orange {
				fill: var(--f-orange);
			}
			.f-slate {
				fill: var(--f-slate);
			}
			.f-slate-deep {
				fill: var(--f-slate-deep);
			}
			.f-ele {
				fill: var(--f-ele);
			}
			.f-ele-deep {
				fill: var(--f-ele-deep);
			}
			.f-rhino {
				fill: var(--f-rhino);
			}
			.f-rhino-deep {
				fill: var(--f-rhino-deep);
			}
			.f-brown {
				fill: var(--f-brown);
			}
			.f-brown-deep {
				fill: var(--f-brown-deep);
			}
			.f-olive {
				fill: var(--f-olive);
			}
			.f-olive-deep {
				fill: var(--f-olive-deep);
			}
			.f-teal {
				fill: var(--f-teal);
			}
			.f-copper {
				fill: var(--f-copper);
			}
			.f-green {
				fill: var(--f-green);
			}
			.f-snow {
				fill: var(--f-snow);
			}
			.f-charcoal {
				fill: var(--f-charcoal);
			}
			.f-horn {
				fill: var(--f-horn);
			}
			.f-bill {
				fill: var(--f-bill);
			}
			.f-tooth {
				fill: var(--f-tooth);
			}
			.f-badge {
				fill: var(--badge-color);
			}
			.s-whisker {
				fill: none;
				stroke: var(--paper-whisker);
				stroke-width: 2;
				stroke-linecap: round;
			}
		</style>
	</head>
	<body>
		<div class="topbar">
			<div class="char-picker" id="picker"></div>
			<button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
				<span class="chip-art" id="theme-icon"></span>
				<span class="chip-name" id="theme-label">Dark</span>
			</button>
		</div>

		<div class="layout">
			<div class="mascot-stage" id="stage"></div>

			<div class="controls">
				<div class="global">
					<button class="stop" id="stop-all" type="button">Stop all loops</button>
					<button class="stop" id="play-all" type="button">Play all once</button>
				</div>
				<div id="cards"></div>
			</div>
		</div>

		<!-- All character art (Sano + the 10 friends), generated from characters.html
		     by tools/build-anim-characters.mjs. Defines window.ANIM_CHARACTERS. -->
		<script src="anim-characters.js?v=76dfda73"></script>
		<script>
			// ---- Animation catalogue ------------------------------------------------
			// One entry per animation. `part` is which body part it needs (a card is
			// shown only when the selected character has that part); `target` is the
			// selector the animation is applied to within the mounted character.
			// Defaults match the tuned values from the original single-mascot tuner.
			const CARDS = [
				{
					name: 'tail-wag',
					part: 'tail',
					target: '.part-tail',
					section: 'idle',
					label: 'Tail wag',
					desc: 'Tail pivots at its base, four wags back and forth.',
					duration: 900,
					easing: 'ease-in-out',
					period: 9,
					loop: true,
				},
				{
					name: 'head-tilt',
					part: 'head',
					target: '.part-head',
					section: 'idle',
					label: 'Head tilt',
					desc: 'Head leans, holds, then straightens. Duration includes the 3s hold.',
					duration: 3800,
					easing: 'ease-in-out',
					period: 22,
					loop: true,
				},
				{
					name: 'eye-blink',
					part: 'eyes',
					target: '.part-eyes',
					section: 'idle',
					label: 'Eye blink',
					desc: 'Eyes briefly squash to a horizontal slit and reopen.',
					duration: 400,
					easing: 'ease-in-out',
					period: 4,
					loop: true,
				},
				{
					name: 'ear-wiggle',
					part: 'ear',
					target: '.part-ear',
					section: 'idle',
					label: 'Ear wiggle',
					desc: 'Both ears twitch outward (mirrored via a CSS variable), then settle.',
					duration: 400,
					easing: 'ease-in-out',
					period: 14,
					loop: true,
				},
				{
					name: 'nose-wiggle',
					part: 'nose',
					target: '.part-nose',
					section: 'idle',
					label: 'Nose wiggle',
					desc: 'Nose and whiskers twitch together — small rotation + lateral nudge.',
					duration: 600,
					easing: 'ease-in-out',
					period: 10,
					loop: true,
				},
				{
					name: 'head-shake',
					part: 'head',
					target: '.part-head',
					section: 'action',
					label: 'Head shake',
					desc: 'Head pivots at the neck — three swings, then a small follow-through.',
					duration: 800,
					easing: 'ease-in-out',
					period: 11,
					loop: false,
				},
				{
					name: 'body-wiggle',
					part: 'body',
					target: '.part-body',
					section: 'action',
					label: 'Body wiggle',
					desc: 'Whole body sways at the feet — subtle, sub-2° rotation.',
					duration: 1000,
					easing: 'ease-in-out',
					period: 13,
					loop: false,
				},
				{
					name: 'excited-jump',
					part: 'body',
					target: '.part-body',
					section: 'action',
					label: 'Excited jump',
					desc: 'Big hop, soft squash on landing, a smaller second hop.',
					duration: 1000,
					easing: 'ease-out',
					period: 17,
					loop: false,
				},
				{
					name: 'little-bow',
					part: 'head',
					target: '.part-head',
					section: 'action',
					label: 'Little bow',
					desc: 'Head tips forward (translateY + scaleY squish), holds, returns.',
					duration: 1100,
					easing: 'ease-in-out',
					period: 19,
					loop: false,
				},
			];
			const SECTION_TITLE = { idle: 'Idle animations', action: 'Action animations' };

			// ---- Character roster ---------------------------------------------------
			// All eleven characters (Sano first) come from characters.html via
			// design/anim-characters.js. Every character implicitly has a `body` (the
			// whole SVG), so body-wiggle and excited-jump always apply.
			const CHARACTERS = (window.ANIM_CHARACTERS || []).map((c) => ({
				...c,
				parts: Array.from(new Set([...(c.parts || []), 'body'])),
			}));

			const stage = document.getElementById('stage');
			const cardsEl = document.getElementById('cards');
			const picker = document.getElementById('picker');

			// Per-animation loop interval ids, keyed by animation name.
			const loops = {};
			function stopAllLoops() {
				Object.values(loops).forEach(clearInterval);
				for (const k in loops) delete loops[k];
			}

			function readCard(card) {
				return {
					name: card.dataset.anim,
					target: card.dataset.target,
					// querySelectorAll within the stage so a single selector can drive
					// multiple elements (e.g. both ears) across both mounted views, and
					// never the head thumbnails in the picker.
					targets: Array.from(stage.querySelectorAll(card.dataset.target)),
					duration: parseInt(card.querySelector('[data-field="duration"]').value, 10),
					easing: card.querySelector('[data-field="easing"]').value.trim() || 'ease-in-out',
					period: parseFloat(card.querySelector('[data-field="period"]').value),
				};
			}

			function play(card) {
				const { name, targets, duration, easing } = readCard(card);
				if (!targets.length) return;
				// Clear inline animation, let two paint frames pass, then re-apply.
				// Reflow isn't enough — the animation engine coalesces same-task style
				// changes and won't restart a finished animation. Double-rAF guarantees
				// the 'cleared' state reaches the compositor.
				targets.forEach((t) => (t.style.animation = ''));
				requestAnimationFrame(() => {
					requestAnimationFrame(() => {
						targets.forEach((t) => (t.style.animation = `${name} ${duration}ms ${easing}`));
					});
				});
				updateSnippet(card);
			}

			function updateSnippet(card) {
				const { name, duration, easing } = readCard(card);
				card.querySelector('[data-snippet]').textContent = `animation: ${name} ${duration}ms ${easing};`;
			}

			function syncLoop(card) {
				const { name, period } = readCard(card);
				const loopOn = card.querySelector('[data-field="loop"]').checked;
				card.querySelector('.loop-toggle').classList.toggle('active', loopOn);

				if (loops[name]) {
					clearInterval(loops[name]);
					delete loops[name];
				}
				if (loopOn && period > 0) {
					play(card);
					loops[name] = setInterval(() => play(card), period * 1000);
				}
			}

			function cardHTML(c) {
				return `
				<div class="card" data-anim="${c.name}" data-target="${c.target}">
					<h2>${c.label}</h2>
					<p class="desc">${c.desc}</p>
					<div class="fields">
						<div class="field">
							<label>Duration (ms)</label>
							<input type="number" data-field="duration" value="${c.duration}" min="100" max="10000" step="50" />
						</div>
						<div class="field">
							<label>Easing</label>
							<input type="text" data-field="easing" value="${c.easing}" />
						</div>
						<div class="field">
							<label>Period (s)</label>
							<input type="number" data-field="period" value="${c.period}" min="0.5" max="60" step="0.5" />
						</div>
					</div>
					<div class="row">
						<button class="play" type="button">Play once</button>
						<label class="loop-toggle"><input type="checkbox" data-field="loop" ${c.loop ? 'checked' : ''} /> Auto-loop</label>
					</div>
					<div class="css-snippet" data-snippet></div>
				</div>`;
			}

			function bindCard(card) {
				updateSnippet(card);
				card.querySelector('.play').addEventListener('click', () => play(card));
				card.querySelector('[data-field="loop"]').addEventListener('change', () => syncLoop(card));
				['duration', 'easing', 'period'].forEach((f) => {
					card.querySelector(`[data-field="${f}"]`).addEventListener('change', () => {
						updateSnippet(card);
						if (card.querySelector('[data-field="loop"]').checked) syncLoop(card);
					});
				});
				// Auto-start any loop checked at load (the idle set), each on a random
				// offset within the first 3s so they don't all fire on the same frame.
				if (card.querySelector('[data-field="loop"]').checked) {
					setTimeout(() => syncLoop(card), Math.random() * 3000);
				}
			}

			function selectCharacter(id) {
				const char = CHARACTERS.find((c) => c.id === id) || CHARACTERS[0];
				stopAllLoops();

				picker.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === char.id));

				// Mount the two views and tag each <svg> as a body for whole-body anims.
				stage.innerHTML = `
					<div class="stage-view">
						<div class="tile">${char.whole}</div>
						<figcaption>whole body</figcaption>
					</div>
					<div class="stage-view">
						<div class="tile">${char.head}</div>
						<figcaption>head</figcaption>
					</div>`;
				stage.querySelectorAll('.tile > svg').forEach((s) => s.classList.add('part-body'));

				// Rebuild the cards for this character's available parts.
				const applicable = CARDS.filter((c) => char.parts.includes(c.part));
				let html = '';
				let lastSection = null;
				for (const c of applicable) {
					if (c.section !== lastSection) {
						html += `<h3 class="section-header">${SECTION_TITLE[c.section]}</h3>`;
						lastSection = c.section;
					}
					html += cardHTML(c);
				}
				cardsEl.innerHTML = html;
				cardsEl.querySelectorAll('.card').forEach(bindCard);
			}

			// ---- Picker + boot ------------------------------------------------------
			picker.innerHTML = CHARACTERS.map(
				(c) =>
					`<button type="button" data-id="${c.id}" aria-label="${c.name}"><span class="chip-art">${c.head}</span><span class="chip-name">${c.name}</span></button>`,
			).join('');
			picker.querySelectorAll('button').forEach((b) => {
				b.addEventListener('click', () => selectCharacter(b.dataset.id));
			});

			// ---- Theme toggle (light default; .dark on <html> mirrors the app) ------
			// Styled as a head-sized chip: a moon/sun icon over a label.
			const THEME_KEY = 'sano-tuner-theme';
			const MOON_ICON =
				'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z" style="fill: var(--path-complete-color)" /></svg>';
			const SUN_ICON =
				'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" style="fill: var(--badge-color)" /><g style="stroke: var(--badge-color); stroke-width: 2; stroke-linecap: round"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M18.9 5.1l-2.1 2.1M7.2 16.8l-2.1 2.1" /></g></svg>';
			const themeBtn = document.getElementById('theme-toggle');
			const themeIcon = document.getElementById('theme-icon');
			const themeLabel = document.getElementById('theme-label');
			function applyTheme(dark) {
				document.documentElement.classList.toggle('dark', dark);
				themeIcon.innerHTML = dark ? SUN_ICON : MOON_ICON;
				themeLabel.textContent = dark ? 'Light' : 'Dark';
				themeBtn.setAttribute('aria-pressed', String(dark));
			}
			themeBtn.addEventListener('click', () => {
				const dark = !document.documentElement.classList.contains('dark');
				localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
				applyTheme(dark);
			});
			// ?theme=dark|light forces a theme for this load (else use the stored one).
			const wantedTheme = new URLSearchParams(location.search).get('theme');
			applyTheme(wantedTheme ? wantedTheme === 'dark' : localStorage.getItem(THEME_KEY) === 'dark');

			document.getElementById('stop-all').addEventListener('click', () => {
				stopAllLoops();
				cardsEl.querySelectorAll('[data-field="loop"]').forEach((cb) => {
					cb.checked = false;
					cb.closest('.card').querySelector('.loop-toggle').classList.remove('active');
				});
			});
			document.getElementById('play-all').addEventListener('click', () => {
				let delay = 0;
				cardsEl.querySelectorAll('.card').forEach((card) => {
					setTimeout(() => play(card), delay);
					delay += 250;
				});
			});

			// ?char=<id> deep link (mirrors characters.html's ?only=), else Sano.
			const wanted = new URLSearchParams(location.search).get('char');
			selectCharacter(wanted && CHARACTERS.some((c) => c.id === wanted) ? wanted : 'sano');
		</script>
	</body>
</html>
