<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Sano — Devanagari Review</title>
		<link rel="stylesheet" href="../css/fonts.css" />
		<style>
			/* ───────────────────────────────────────────────────────────────
			   A localhost-only review tool: every course phrase shown with its
			   English, romanization, audio, and an editable Devanagari box, so a
			   native speaker can fix the AI-drafted `dev` strings in js/data.js.
			   Changes POST to devanagari-save.php, which merges them into
			   design/devanagari-review.json for Ross to verify + merge by hand.
			   Not in the deploy rsync (design/ never ships).

			   Brand tokens copied verbatim from css/sano.css (the source of
			   truth); 1rem = 10px (base-font 62.5% on <html>).
			   ─────────────────────────────────────────────────────────────── */
			html {
				font-size: 62.5%;
				color-scheme: light;

				--accent: #dd6470; /* paper crimson: edited rows, focus, submit */
				--accent-deep: #b94f5b;
				--path-complete-color: #56629e; /* paper indigo: saved rows */

				--text-color-richer: #2e2933;
				--text-color-normal: #45404c;
				--text-color-soft: #79705f;
				--text-color-softer: #b1a795;

				--text-complete-color: #38824a;

				--background-color: #fbf5e9;
				--background-color-softer: #f3ecdb;

				--border-color: #e0d8c4;
				--border-color-softer: #e9e2d1;

				--button-primary-color: #fff;

				/* A system Devanagari face — no webfont, so the tool makes no
				   external request (mirrors the app's offline discipline). */
				--dev-font: 'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Devanagari MT', 'Mangal', 'Nirmala UI', sans-serif;
			}
			/* Dark theme is class-toggled (html.dark) so the top-bar toggle can
			   override the OS — mirrors the other design pages. */
			html.dark {
				color-scheme: dark;
				--accent: #e0697a;
				--accent-deep: #c25462;
				--path-complete-color: #7384c4;

				--text-color-richer: #efe9f0;
				--text-color-normal: #d8d1da;
				--text-color-soft: #9a91a4;
				--text-color-softer: #645c70;

				--text-complete-color: #7fae83;

				--background-color: #1b1822;
				--background-color-softer: #262230;

				--border-color: #37323f;
				--border-color-softer: #2e2a38;
			}

			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family: 'Lato', 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif;
				font-weight: 300;
				font-size: 1.7rem;
				line-height: 1.5;
				color: var(--text-color-normal);
				background: var(--background-color);
				padding-bottom: 11rem; /* clear the floating Submit button */
			}

			/* ── Sticky top bar ─────────────────────────────────────────────── */
			.topbar {
				position: sticky;
				top: 0;
				z-index: 5;
				background: color-mix(in srgb, var(--background-color) 92%, transparent);
				backdrop-filter: blur(6px);
				border-bottom: 1px solid var(--border-color);
				padding: 1.8rem max(2.4rem, (100vw - 1160px) / 2) 1.4rem;
			}
			.topbar-head {
				display: flex;
				align-items: baseline;
				flex-wrap: wrap;
				gap: 0.6rem 1.6rem;
			}
			.topbar h1 {
				font-family: 'Neuton', serif;
				font-weight: 700;
				font-size: 3.4rem;
				line-height: 1;
				margin: 0;
				color: var(--text-color-richer);
			}
			.topbar .lede {
				margin: 0;
				color: var(--text-color-soft);
				font-size: 1.5rem;
				flex: 1 1 28rem;
			}
			.theme-toggle {
				margin-left: auto;
				flex-shrink: 0;
				appearance: none;
				border: 1px solid var(--border-color);
				background: var(--background-color-softer);
				color: var(--text-color-soft);
				font: inherit;
				font-size: 1.5rem;
				line-height: 1;
				padding: 0.7rem 1rem;
				border-radius: 999px;
				cursor: pointer;
			}
			.theme-toggle:hover {
				border-color: var(--accent);
				color: var(--text-color-richer);
			}

			/* Toolbar: search + filter + live counts */
			.toolbar {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 1rem 1.6rem;
				margin-top: 1.4rem;
			}
			.search {
				flex: 1 1 22rem;
				max-width: 36rem;
				appearance: none;
				font: inherit;
				font-size: 1.6rem;
				padding: 0.8rem 1.2rem;
				color: var(--text-color-richer);
				background: var(--background-color-softer);
				border: 1px solid var(--border-color);
				border-radius: 0.9rem;
			}
			.search:focus-visible {
				outline: none;
				border-color: var(--accent);
			}
			.filter-toggle {
				display: inline-flex;
				align-items: center;
				gap: 0.6rem;
				font-size: 1.5rem;
				color: var(--text-color-soft);
				cursor: pointer;
				user-select: none;
			}
			.filter-toggle input {
				width: 1.7rem;
				height: 1.7rem;
				accent-color: var(--accent);
			}
			.counts {
				margin-left: auto;
				display: flex;
				gap: 1.4rem;
				font-size: 1.45rem;
				color: var(--text-color-soft);
			}
			.counts b {
				color: var(--text-color-richer);
				font-weight: 700;
			}
			.counts .c-edited b {
				color: var(--accent);
			}
			.counts .c-saved b {
				color: var(--text-complete-color);
			}

			/* ── Units + rows ───────────────────────────────────────────────── */
			main {
				max-width: 1160px;
				margin: 0 auto;
				padding: 0 2.4rem;
			}
			.unit {
				margin-top: 3.2rem;
			}
			.unit-head {
				display: flex;
				align-items: baseline;
				gap: 1rem;
				padding-bottom: 0.8rem;
				border-bottom: 2px solid var(--border-color);
			}
			.unit-head h2 {
				font-family: 'Neuton', serif;
				font-weight: 700;
				font-size: 2.6rem;
				margin: 0;
				color: var(--text-color-richer);
			}
			.unit-head .kind {
				font-size: 1.3rem;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--text-color-softer);
			}
			.unit-head .n {
				margin-left: auto;
				font-size: 1.4rem;
				color: var(--text-color-softer);
			}

			.row {
				display: grid;
				grid-template-columns: 0.4rem minmax(0, 1.15fr) minmax(0, 1fr) auto minmax(0, 1.35fr) minmax(0, 0.9fr) auto;
				align-items: center;
				gap: 1.4rem;
				padding: 1rem 0.8rem 1rem 0;
				border-bottom: 1px solid var(--border-color-softer);
			}
			.row .bar {
				align-self: stretch;
				border-radius: 999px;
				background: transparent;
			}
			.row.edited .bar {
				background: var(--accent);
			}
			.row.saved .bar {
				background: var(--path-complete-color);
			}
			.row.edited {
				background: color-mix(in srgb, var(--accent) 7%, transparent);
			}

			.en {
				color: var(--text-color-richer);
				font-size: 1.7rem;
			}
			.rom .np {
				font-weight: 700;
				color: var(--text-color-richer);
				font-size: 1.7rem;
			}
			.rom .pron {
				display: block;
				font-size: 1.35rem;
				color: var(--text-color-softer);
			}

			.play {
				appearance: none;
				border: 1px solid var(--border-color);
				background: var(--background-color-softer);
				color: var(--accent);
				width: 4rem;
				height: 4rem;
				border-radius: 50%;
				cursor: pointer;
				display: grid;
				place-items: center;
				flex-shrink: 0;
			}
			.play:hover {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--button-primary-color);
			}
			.play svg {
				width: 1.9rem;
				height: 1.9rem;
				fill: currentColor;
			}
			.play.playing {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--button-primary-color);
			}

			.dev-cell {
				display: flex;
				flex-direction: column;
				gap: 0.4rem;
			}
			.dev-input {
				appearance: none;
				font-family: var(--dev-font);
				font-size: 2.6rem;
				line-height: 1.25;
				width: 100%;
				padding: 0.5rem 1rem;
				color: var(--text-color-richer);
				background: var(--background-color-softer);
				border: 1px solid var(--border-color);
				border-radius: 0.8rem;
			}
			.dev-input:focus-visible {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
			}
			.rec {
				display: flex;
				align-items: baseline;
				gap: 0.5rem;
				flex-wrap: wrap;
				font-size: 1.35rem;
				color: var(--text-color-soft);
			}
			.rec-flag {
				font-size: 1.05rem;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--accent);
				border: 1px solid var(--border-color);
				border-radius: 0.5rem;
				padding: 0 0.4rem;
			}
			.rec-en {
				color: var(--text-color-richer);
			}
			.row.edited .dev-input {
				border-color: var(--accent);
			}
			.draft-hint {
				font-size: 1.35rem;
				color: var(--text-color-softer);
			}
			.draft-hint b {
				font-family: var(--dev-font);
				font-weight: 400;
				font-size: 1.7rem;
				color: var(--text-color-soft);
			}

			.revert {
				appearance: none;
				border: none;
				background: transparent;
				color: var(--text-color-softer);
				font-size: 1.9rem;
				line-height: 1;
				cursor: pointer;
				padding: 0.4rem;
				border-radius: 0.6rem;
				visibility: hidden;
			}
			.revert:hover {
				color: var(--accent);
				background: var(--background-color-softer);
			}
			.row.edited .revert {
				visibility: visible;
			}

			.empty {
				margin: 6rem 0;
				text-align: center;
				color: var(--text-color-softer);
				font-size: 1.8rem;
			}

			/* ── Conversations (read-only context block) ─────────────────────── */
			.convo-wrap {
				max-width: 1160px;
				margin: 0 auto;
				padding: 0 2.4rem;
			}
			.convo-intro {
				margin-top: 5rem;
				padding-top: 2.6rem;
				border-top: 3px solid var(--border-color);
			}
			.convo-intro h2 {
				font-family: 'Neuton', serif;
				font-weight: 700;
				font-size: 3rem;
				margin: 0 0 0.6rem;
				color: var(--text-color-richer);
			}
			.convo-intro p {
				margin: 0;
				max-width: 72rem;
				color: var(--text-color-soft);
				font-size: 1.5rem;
			}
			.convo-intro code {
				font-family: ui-monospace, 'SF Mono', Menlo, monospace;
				font-size: 1.35rem;
				background: var(--background-color-softer);
				padding: 0.1rem 0.5rem;
				border-radius: 0.4rem;
			}
			.convo {
				margin-top: 3.2rem;
			}
			.convo-head {
				display: flex;
				align-items: baseline;
				flex-wrap: wrap;
				gap: 0.4rem 1.2rem;
				padding-bottom: 0.8rem;
				border-bottom: 2px solid var(--border-color);
			}
			.convo-head h3 {
				font-family: 'Neuton', serif;
				font-weight: 700;
				font-size: 2.2rem;
				margin: 0;
				color: var(--text-color-richer);
			}
			.convo-meta {
				font-size: 1.4rem;
				color: var(--text-color-softer);
			}
			.convo-meta b {
				color: var(--text-color-soft);
				font-weight: 700;
			}
			.cline {
				display: grid;
				grid-template-columns: 9rem minmax(0, 1fr) auto;
				align-items: center;
				gap: 1.4rem;
				padding: 1.1rem 0.4rem;
				border-bottom: 1px solid var(--border-color-softer);
			}
			.cspk {
				font-size: 1.4rem;
				font-weight: 700;
				color: var(--accent-deep);
				text-align: right;
			}
			.cbody {
				display: flex;
				flex-direction: column;
				gap: 0.2rem;
			}
			.cdev {
				font-family: var(--dev-font);
				font-size: 2.4rem;
				line-height: 1.3;
				color: var(--text-color-richer);
			}
			.crom {
				font-size: 1.55rem;
				font-weight: 700;
				color: var(--text-color-normal);
			}
			.cen {
				font-size: 1.5rem;
				color: var(--text-color-soft);
			}
			/* Narrator lines are scene-setting — quieter and italic. */
			.who-narrator .cspk {
				color: var(--text-color-softer);
				font-weight: 400;
				font-style: italic;
			}
			.who-narrator .cdev {
				color: var(--text-color-normal);
			}
			.who-narrator .crom {
				font-weight: 400;
				font-style: italic;
				color: var(--text-color-soft);
			}
			.who-narrator .cen {
				font-style: italic;
			}
			@media (max-width: 720px) {
				.cline {
					grid-template-columns: 1fr auto;
					grid-template-areas:
						'spk play'
						'body body';
					gap: 0.4rem 1.2rem;
				}
				.cspk {
					grid-area: spk;
					text-align: left;
				}
				.cbody {
					grid-area: body;
				}
				.cline .play {
					grid-area: play;
				}
			}

			/* ── Floating Submit ────────────────────────────────────────────── */
			.submit {
				position: fixed;
				right: 2.4rem;
				bottom: 2.4rem;
				z-index: 10;
				appearance: none;
				border: none;
				cursor: pointer;
				font: inherit;
				font-weight: 700;
				font-size: 1.8rem;
				color: var(--button-primary-color);
				background: var(--accent);
				padding: 1.4rem 2.4rem;
				border-radius: 999px;
				box-shadow: 0 0.6rem 2rem color-mix(in srgb, var(--accent) 40%, transparent);
			}
			.submit:hover {
				background: var(--accent-deep);
			}
			.submit:disabled {
				cursor: default;
				color: var(--text-color-softer);
				background: var(--background-color-softer);
				border: 1px solid var(--border-color);
				box-shadow: none;
			}

			/* ── Toast ──────────────────────────────────────────────────────── */
			.toast {
				position: fixed;
				left: 50%;
				bottom: 2.4rem;
				transform: translate(-50%, 1.6rem);
				z-index: 11;
				max-width: 90vw;
				padding: 1.2rem 1.8rem;
				border-radius: 0.9rem;
				font-size: 1.55rem;
				color: var(--button-primary-color);
				background: var(--path-complete-color);
				box-shadow: 0 0.6rem 2rem rgba(0, 0, 0, 0.2);
				opacity: 0;
				pointer-events: none;
				transition:
					opacity 0.2s ease,
					transform 0.2s ease;
			}
			.toast.show {
				opacity: 1;
				transform: translate(-50%, 0);
			}
			.toast.error {
				background: var(--accent-deep);
			}

			@media (max-width: 720px) {
				.row {
					grid-template-columns: 0.4rem 1fr auto auto;
					grid-template-areas:
						'bar en play revert'
						'bar rom rom rom'
						'bar dev dev dev';
					gap: 0.6rem 1.2rem;
				}
				.row .bar {
					grid-area: bar;
				}
				.en {
					grid-area: en;
				}
				.rom {
					grid-area: rom;
				}
				.play {
					grid-area: play;
				}
				.dev-cell {
					grid-area: dev;
				}
				.revert {
					grid-area: revert;
				}
				.rec {
					display: none;
				}
			}
		</style>
		<script>
			// Apply the saved / ?theme= / OS theme before paint so there's no flash.
			(function () {
				var url = new URLSearchParams(location.search).get('theme');
				var saved = localStorage.getItem('sano-devanagari-theme');
				var dark = url ? url === 'dark' : saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
	</head>
	<body>
		<header class="topbar">
			<div class="topbar-head">
				<h1>Devanagari Review</h1>
				<p class="lede">
					Tap ▶ to hear each word, read the English and romanization, and correct the Devanagari box if it's wrong. Edited rows
					turn pink — tap <b>Submit</b> (bottom-right) to save.
				</p>
				<button class="theme-toggle" id="theme" type="button">Theme</button>
			</div>
			<div class="toolbar">
				<input class="search" id="search" type="search" placeholder="Search English / romanized / Devanagari…" />
				<label class="filter-toggle"><input type="checkbox" id="edited-only" /> Changed only</label>
				<div class="counts">
					<span class="c-total"><b id="n-total">0</b> items</span>
					<span class="c-saved"><b id="n-saved">0</b> saved</span>
					<span class="c-edited"><b id="n-edited">0</b> unsaved</span>
				</div>
			</div>
		</header>

		<main id="units"></main>
		<p class="empty" id="empty" hidden>No matching words.</p>

		<button class="submit" id="submit" type="button" disabled>No changes</button>
		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script src="../js/data.js"></script>
		<script src="../js/romanize.js"></script>
		<script>
			'use strict';

			const REVIEW_URL = './devanagari-review.json';
			const SAVE_URL = './devanagari-save.php';
			const AUDIO_BASE = '../audio/default/'; // one default voice today (see js/audio.js)

			// ── Audio: a single reused element, same model the app uses ───────
			let audioEl = null;
			let playingBtn = null;
			function playAudio(id, btn) {
				playSrc(AUDIO_BASE + encodeURIComponent(id) + '.mp3', btn);
			}
			function playSrc(src, btn) {
				if (!audioEl) {
					audioEl = new Audio();
					audioEl.addEventListener('ended', clearPlaying);
					audioEl.addEventListener('pause', clearPlaying);
				}
				if (playingBtn && playingBtn !== btn) playingBtn.classList.remove('playing');
				audioEl.pause();
				audioEl.src = src;
				playingBtn = btn;
				btn.classList.add('playing');
				const p = audioEl.play();
				if (p && p.catch) p.catch(clearPlaying);
			}
			function clearPlaying() {
				if (playingBtn) playingBtn.classList.remove('playing');
				playingBtn = null;
			}

			// ── State helpers ─────────────────────────────────────────────────
			// source  = the AI draft from js/data.js
			// saved   = a correction already in the review file (null if none)
			// A row's baseline (what's persisted) is the saved correction, else source.
			const rows = [];
			const baseline = (r) => (r.saved != null ? r.saved : r.source);
			const current = (r) => r.input.value.trim();
			const isEdited = (r) => current(r) !== baseline(r);

			function svgVolume() {
				return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
			}

			// ── Build the table from COURSE ───────────────────────────────────
			function build() {
				const root = document.getElementById('units');
				let total = 0;
				for (const unit of COURSE) {
					const section = document.createElement('section');
					section.className = 'unit';
					const head = document.createElement('div');
					head.className = 'unit-head';
					const h2 = document.createElement('h2');
					h2.textContent = unit.title;
					const kind = document.createElement('span');
					kind.className = 'kind';
					kind.textContent = unit.kind;
					const n = document.createElement('span');
					n.className = 'n';
					n.textContent = unit.items.length + ' words';
					head.append(h2, kind, n);
					section.appendChild(head);

					const unitRows = [];
					for (const item of unit.items) {
						total++;
						const row = document.createElement('div');
						row.className = 'row';

						const bar = document.createElement('span');
						bar.className = 'bar';

						const en = document.createElement('div');
						en.className = 'en';
						en.textContent = item.en;

						const rom = document.createElement('div');
						rom.className = 'rom';
						const np = document.createElement('span');
						np.className = 'np';
						np.textContent = item.np;
						const pron = document.createElement('span');
						pron.className = 'pron';
						pron.textContent = item.pron || '';
						rom.append(np, pron);

						const play = document.createElement('button');
						play.type = 'button';
						play.className = 'play';
						play.setAttribute('aria-label', 'Play ' + item.en);
						play.innerHTML = svgVolume();
						play.addEventListener('click', () => playAudio(item.id, play));

						const devCell = document.createElement('div');
						devCell.className = 'dev-cell';
						const input = document.createElement('input');
						input.className = 'dev-input';
						input.type = 'text';
						input.lang = 'ne';
						input.dir = 'auto';
						input.spellcheck = false;
						input.value = item.dev || '';
						input.setAttribute('aria-label', 'Devanagari for ' + item.en);
						const hint = document.createElement('div');
						hint.className = 'draft-hint';
						hint.hidden = true;
						devCell.append(input, hint);

						const rec = document.createElement('div');
						rec.className = 'rec';

						const revert = document.createElement('button');
						revert.type = 'button';
						revert.className = 'revert';
						revert.title = 'Undo unsaved change';
						revert.textContent = '↺';

						row.append(bar, en, rom, play, devCell, rec, revert);
						section.appendChild(row);

						const r = {
							item: item,
							source: (item.dev || '').trim(),
							saved: null,
							input: input,
							row: row,
							hint: hint,
							rec: rec,
						};
						input.addEventListener('input', () => {
							refreshRow(r);
							refreshCounts();
						});
						revert.addEventListener('click', () => {
							input.value = baseline(r);
							refreshRow(r);
							refreshCounts();
						});
						rows.push(r);
						unitRows.push(r);
					}
					root.appendChild(section);
					section._rows = unitRows;
				}
				document.getElementById('n-total').textContent = total;
			}

			// ── Per-row + global visuals ──────────────────────────────────────
			function refreshRow(r) {
				const cur = current(r);
				const edited = cur !== baseline(r);
				const overridden = cur !== r.source && cur !== '';
				r.row.classList.toggle('edited', edited);
				r.row.classList.toggle('saved', !edited && r.saved != null && r.saved !== r.source);
				r.hint.hidden = !overridden;
				if (overridden) r.hint.innerHTML = 'AI draft: <b></b>';
				if (overridden) r.hint.querySelector('b').textContent = r.source || '—';
			}

			const submitBtn = document.getElementById('submit');
			function refreshCounts() {
				let edited = 0,
					saved = 0;
				for (const r of rows) {
					if (isEdited(r)) edited++;
					else if (r.saved != null && r.saved !== r.source) saved++;
				}
				document.getElementById('n-edited').textContent = edited;
				document.getElementById('n-saved').textContent = saved;
				submitBtn.disabled = edited === 0;
				submitBtn.textContent = edited === 0 ? 'No changes' : 'Submit ' + edited + ' change' + (edited === 1 ? '' : 's');
			}

			// ── Restore corrections already in the review file ────────────────
			async function loadReview() {
				try {
					const res = await fetch(REVIEW_URL, { cache: 'no-store' });
					if (res.ok) {
						const map = await res.json();
						for (const r of rows) {
							const e = map && map[r.item.id];
							const dev = e && typeof e.dev === 'string' ? e.dev.trim() : '';
							if (dev && dev !== r.source) {
								r.saved = dev;
								r.input.value = dev;
							}
						}
					}
				} catch (_) {
					/* no review file yet — fine */
				}
				for (const r of rows) refreshRow(r);
				refreshCounts();
			}

			// ── Search + "changed only" filter ────────────────────────────────
			const searchEl = document.getElementById('search');
			const editedOnlyEl = document.getElementById('edited-only');
			function applyFilter() {
				const q = searchEl.value.trim().toLowerCase();
				const editedOnly = editedOnlyEl.checked;
				let anyVisible = false;
				for (const section of document.querySelectorAll('.unit')) {
					let visible = 0;
					for (const r of section._rows) {
						const hay = (
							r.item.en +
							' ' +
							r.item.np +
							' ' +
							(r.item.pron || '') +
							' ' +
							r.source +
							' ' +
							current(r)
						).toLowerCase();
						const matchQ = !q || hay.indexOf(q) !== -1;
						const changed = current(r) !== r.source || isEdited(r);
						const show = matchQ && (!editedOnly || changed);
						r.row.hidden = !show;
						if (show) visible++;
					}
					section.hidden = visible === 0;
					anyVisible = anyVisible || visible > 0;
				}
				document.getElementById('empty').hidden = anyVisible;
				// The conversations block is a separate read-only reference — hide it
				// while the user is searching/filtering the editable rows.
				const convos = document.getElementById('conversations');
				if (convos) convos.hidden = !!q || editedOnly;
			}
			searchEl.addEventListener('input', applyFilter);
			editedOnlyEl.addEventListener('change', applyFilter);

			// ── Submit changed rows to the PHP backend ────────────────────────
			async function submit() {
				const edits = [];
				for (const r of rows) {
					if (!isEdited(r)) continue;
					const cur = current(r);
					if (cur === r.source || cur === '') {
						// reverted/cleared an override → ask the backend to drop it
						if (r.saved != null) edits.push({ id: r.item.id, remove: true });
					} else {
						edits.push({
							id: r.item.id,
							dev: cur,
							old: r.source,
							en: r.item.en,
							np: r.item.np,
						});
					}
				}
				if (!edits.length) return;
				submitBtn.disabled = true;
				try {
					const res = await fetch(SAVE_URL, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'X-Sano-Request': '1' },
						body: JSON.stringify({ edits: edits }),
					});
					const data = await res.json().catch(() => ({}));
					if (!res.ok || !data.ok) throw new Error(data.error || 'HTTP ' + res.status);
					// Commit the new baselines so re-submits only send further edits.
					for (const r of rows) {
						if (!isEdited(r)) continue;
						const cur = current(r);
						if (cur === r.source || cur === '') {
							r.saved = null;
							r.input.value = r.source;
						} else {
							r.saved = cur;
						}
					}
					for (const r of rows) refreshRow(r);
					refreshCounts();
					applyFilter();
					toast(data.total + ' correction' + (data.total === 1 ? '' : 's') + ' saved to the review file.');
				} catch (err) {
					refreshCounts();
					toast('Could not save: ' + err.message, true);
				}
			}
			submitBtn.addEventListener('click', submit);

			// ── Toast ─────────────────────────────────────────────────────────
			let toastTimer = null;
			function toast(msg, isError) {
				const el = document.getElementById('toast');
				el.textContent = msg;
				el.classList.toggle('error', !!isError);
				el.classList.add('show');
				clearTimeout(toastTimer);
				toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
			}

			// ── Theme toggle ──────────────────────────────────────────────────
			document.getElementById('theme').addEventListener('click', () => {
				const dark = document.documentElement.classList.toggle('dark');
				localStorage.setItem('sano-devanagari-theme', dark ? 'dark' : 'light');
			});

			// ── Coverage recommendations (tools/dict/coverage-report.md) ───
			// The ground-truth dictionary flags COURSE translations it disagrees with.
			// Fetch the report (served by php -S; under file:// it 404s and we skip) and
			// annotate matching rows with the dict's suggested gloss. Flag-only — the
			// AI-drafted English stays Ross's to change.
			async function applyCoverageRecs() {
				let text;
				try {
					const res = await fetch('../tools/dict/coverage-report.md');
					if (!res.ok) return;
					text = await res.text();
				} catch (e) {
					return;
				}
				const recs = {}; // itemId -> { courseEn, dictEn }
				let inSection = false;
				for (const raw of text.split('\n')) {
					const line = raw.trimEnd();
					if (line.startsWith('## ')) {
						inSection = /COURSE translations to review/i.test(line);
						continue;
					}
					if (!inSection) continue;
					const m = line.match(/^- .+? \(([^)]+)\): COURSE "(.*?)" vs dict "(.*?)"$/);
					if (!m) continue;
					const [, ids, courseEn, dictEn] = m;
					for (const id of ids.split(',').map((s) => s.trim())) if (id) recs[id] = { courseEn, dictEn };
				}
				for (const r of rows) {
					const rec = recs[r.item.id];
					if (!rec) continue;
					const flag = document.createElement('span');
					flag.className = 'rec-flag';
					flag.textContent = 'dict';
					const en = document.createElement('span');
					en.className = 'rec-en';
					en.textContent = rec.dictEn;
					r.rec.replaceChildren(flag, en);
					r.rec.title =
						'Dictionary disagrees: COURSE “' +
						rec.courseEn +
						'” vs dict “' +
						rec.dictEn +
						'” (flag only, never auto-applied)';
				}
			}

			// ── Go ────────────────────────────────────────────────────────────
			build();
			applyCoverageRecs();
			loadReview();
		</script>
	</body>
</html>
