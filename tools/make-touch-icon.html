<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
			}
			svg {
				display: block;
				width: 100vmin;
				height: 100vmin;
			}
		</style>
	</head>
	<body>
		<!-- App-icon source: Sano's head-only crop (the footer variant from
		     index.html — its 9-point indigo backing wraps the whole head, including
		     the chin, for a full blue outline). Flat paper-cut shapes (no grain, no
		     drop-shadow) in the brand's dark-theme tokens on the dark-paper ground.
		     The head's native bbox is centered on (100,62.5), so
		     translate(60 60) scale(S) translate(-100 -62.5) drops it dead-center.
		     Append `?safe` for the maskable variant (smaller scale so the ears stay
		     inside the safe zone iOS / Android may crop).

		     Headless Chrome clamps its window to a ~500px minimum, so rendering this at
		     180/192 with tools/screenshot.sh produces a cropped top-left zoom. Always
		     render at 512 and downscale: see CLAUDE.md "App icons". -->
		<svg viewBox="0 0 120 120">
			<!-- Dark-paper background (matches --background-color in dark mode). -->
			<rect width="120" height="120" fill="#1b1822" />
			<!-- Footer head in native head space (bbox center 100,62.5), centered + scaled. -->
			<g id="content" transform="translate(60 60) scale(0.81) translate(-100 -62.5)">
				<!-- Indigo head backing (full outline incl. chin) -->
				<path d="M100 11 L144 34 L148 66 L146 94 L118 114 L82 114 L54 94 L52 66 L56 34 Z" fill="#7384c4" />
				<!-- Outer ears (crimson) -->
				<path d="M62 18 L88 34 L70 58 L48 42 Z" fill="#e0697a" />
				<path d="M138 18 L112 34 L130 58 L152 42 Z" fill="#e0697a" />
				<!-- Inner ears (petal) -->
				<path d="M64 26 L80 36 L69 50 L55 40 Z" fill="#f0bfc7" />
				<path d="M136 26 L120 36 L131 50 L145 40 Z" fill="#f0bfc7" />
				<!-- Face (cream) -->
				<path d="M100 30 L134 48 L138 86 L114 108 L86 108 L62 86 L66 48 Z" fill="#e6dac4" />
				<!-- Eyes (ink) -->
				<circle cx="88" cy="72" r="6" fill="#2e2935" />
				<circle cx="112" cy="72" r="6" fill="#2e2935" />
				<!-- Nose (crimson) -->
				<path d="M93 88 L107 88 L100 97 Z" fill="#e0697a" />
				<!-- Whiskers -->
				<path
					d="M70 80 L56 76 M70 86 L57 88 M130 80 L144 76 M130 86 L143 88"
					fill="none"
					stroke="#8d8474"
					stroke-width="2"
					stroke-linecap="round"
				/>
			</g>
		</svg>
		<script>
			if (location.search.includes('safe')) {
				document.getElementById('content').setAttribute('transform', 'translate(60 60) scale(0.648) translate(-100 -62.5)');
			}
		</script>
	</body>
</html>
