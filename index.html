	<body>

				<symbol id="i-lock" viewBox="0 0 24 24">

						d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"

					/>

				<symbol id="i-navigate_before" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></symbol>
				<symbol id="i-navigate_next" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /></symbol>
				<symbol id="i-person" viewBox="0 0 24 24">
					<path
						d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
					/>
				</symbol>
				<symbol id="i-play_arrow" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></symbol>
				<symbol id="i-school" viewBox="0 0 24 24">
					<path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z" />
				</symbol>
				<symbol id="i-spellcheck" viewBox="0 0 24 24">
					<path
						d="M12.45 16h2.09L9.43 3H7.57L2.46 16h2.09l1.12-3h5.64l1.14 3zm-6.02-5L8.5 5.48 10.57 11H6.43zm15.16.59l-8.09 8.09L9.83 16l-1.41 1.41 5.09 5.09L23 13l-1.41-1.41z"
					/>
				</symbol>
				<symbol id="i-style" viewBox="0 0 24 24">
					<path
						d="M2.53 19.65l1.34.56v-9.03l-2.43 5.86c-.41 1.02.08 2.19 1.09 2.61zm19.5-3.7L17.07 3.98c-.31-.75-1.04-1.21-1.81-1.23-.26 0-.53.04-.79.15L7.1 5.95c-.75.31-1.21 1.03-1.23 1.8-.01.27.04.54.15.8l4.96 11.97c.31.76 1.05 1.22 1.83 1.23.26 0 .52-.05.77-.15l7.36-3.05c1.02-.42 1.51-1.59 1.09-2.6zM7.88 8.75c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-2 11c0 1.1.9 2 2 2h1.45l-3.45-8.34v6.34z"

				<symbol id="i-toc" viewBox="0 0 24 24">

				</symbol>
			</defs>
		</svg>
		<div class="container" id="nepali">
			<div id="header">
				<h1>
					<svg class="sano-mascot" viewBox="40 10 140 174" aria-hidden="true">
						<g class="paper-grain">
							<g class="cut">
								<path
									d="M100 18 L138 38 L142 66 L150 150 L120 178 L80 178 L50 150 L58 66 L62 38 Z"
									class="f-indigo"
								/>
							</g>
							<g class="cut">
								<path d="M62 18 L88 34 L70 58 L48 42 Z" class="f-crimson" />
								<path d="M138 18 L112 34 L130 58 L152 42 Z" class="f-crimson" />
								<path d="M64 26 L80 36 L69 50 L55 40 Z" class="f-petal" />
								<path d="M136 26 L120 36 L131 50 L145 40 Z" class="f-petal" />
							</g>
							<g class="cut"><path d="M100 30 L134 48 L138 86 L114 108 L86 108 L62 86 L66 48 Z" class="f-cream" /></g>
							<g class="cut">
								<path d="M76 110 L124 110 L142 150 L118 174 L82 174 L58 150 Z" class="f-cream-deep" />
							</g>
							<g class="cut"><path d="M140 152 L172 140 L160 158 L176 166 L142 164 Z" class="f-crimson" /></g>
							<circle cx="88" cy="72" r="4.4" class="f-ink" />
							<circle cx="112" cy="72" r="4.4" class="f-ink" />
							<path d="M94 88 L106 88 L100 96 Z" class="f-crimson" />
							<path d="M70 80 L56 76 M70 86 L57 88 M130 80 L144 76 M130 86 L143 88" class="s-whisker" />
						</g>
					</svg>
					Sano
				</h1>
				<p id="controls" class="loading">
					<input type="text" id="name-field" name="name-field" placeholder="Enter your name here to track progress" />
					<button id="submit">Submit</button>
					<a id="controls-signin" role="button">Sign in</a>
				</p>
				<p id="progress" class="loading">
					<span id="name"></span>
					<span class="icon" id="streak-label" role="img" aria-label="Day streak" title="Day streak"
						><svg><use href="#i-bolt" /></svg
					></span>
					<span id="streak">0</span>
					<span class="icon" id="words-today-label" role="img" aria-label="Words today" title="Words today"
						><svg><use href="#i-spellcheck" /></svg
					></span>
					<span id="words-today">0</span>
					<span class="icon" id="words-all-time-label" role="img" aria-label="Words all time" title="Words all time"
						><svg><use href="#i-menu_book" /></svg
					></span>
					<span id="words-all-time">0</span>
					<button type="button" class="icon" id="nav-home" title="Lessons" aria-label="Lessons">
						<svg><use href="#i-school" /></svg>
					</button>
					<button type="button" class="icon" id="nav-dictionary" title="Dictionary" aria-label="Dictionary">
						<svg><use href="#i-toc" /></svg>
					</button>
					<button type="button" class="icon" id="open-flashcards" title="Flashcards" aria-label="Flashcards">
						<svg><use href="#i-style" /></svg>
					</button>
					<button type="button" class="icon" id="open-quiz" title="Quiz" aria-label="Quiz">
						<svg><use href="#i-grading" /></svg>
					</button>
					<button type="button" class="icon" id="account-button" title="Account" aria-label="Account">
						<svg><use href="#i-person" /></svg>
					</button>
				</p>
				<div id="login-panel" class="hide">
					<form id="login-form">
						<input
							type="text"
							id="login-username"
							name="username"
							placeholder="Username"
							autocomplete="username"
							autocapitalize="none"
						/>
						<input
							type="password"
							id="login-password"
							name="password"
							placeholder="Password"
							autocomplete="current-password"
						/>
						<button type="submit" id="login-submit">Sign in</button>
						<p id="login-error" class="hide"></p>
					</form>
					<div id="logout-row" class="hide">
						<span id="login-status"></span>
						<button type="button" id="logout-button">Sign out</button>
					</div>
				</div>
			</div>

			<div id="screen-home">
				<p id="intro">Essential Nepali phrases with Romanized pronunciations for English speakers</p>
				<button id="daily-lesson">Start today's lesson</button>
				<div id="path"></div>
				<p id="dictionary-link-wrap"><a id="dictionary-link">Browse the full dictionary →</a></p>
			</div>

			<div id="screen-lesson" class="hide">
				<div id="lesson-top">
					<a id="lesson-quit" class="icon" role="button" aria-label="Quit lesson"
						><svg><use href="#i-close" /></svg
					></a>
					<div id="lesson-progress"><div id="lesson-progress-fill"></div></div>
				</div>
				<div id="exercise-body">
					<p id="exercise-label"></p>
					<div id="exercise-word"></div>
					<div id="exercise-pronounce"></div>
					<ol id="exercise-choices">
						<li><button></button></li>
						<li><button></button></li>
						<li><button></button></li>
						<li><button></button></li>
					</ol>
					<div id="exercise-wordbank" class="hide">
						<div id="wordbank-answer"></div>
						<div id="wordbank-pool"></div>
					</div>
					<p id="exercise-type" class="hide">
						<input
							type="text"
							id="type-answer"
							autocomplete="off"
							autocapitalize="off"
							spellcheck="false"
							placeholder="Type the Nepali…"
						/>
					</p>
					<div id="exercise-match" class="hide">
						<div id="match-left"></div>
						<div id="match-right"></div>
					</div>
					<button id="exercise-check" class="hide">Check</button>
				</div>
				<div id="lesson-feedback" class="hide">
					<div class="container">
						<p id="feedback-title"></p>
						<p id="feedback-answer"></p>
						<button id="lesson-continue">Continue</button>
					</div>
				</div>
			</div>

			<div id="screen-complete" class="hide">
				<svg class="sano-mascot" id="complete-sano" viewBox="40 10 140 174" aria-hidden="true">
					<g class="paper-grain">
						<g class="cut">
							<path d="M100 18 L138 38 L142 66 L150 150 L120 178 L80 178 L50 150 L58 66 L62 38 Z" class="f-indigo" />
						</g>
						<g class="cut">
							<path d="M62 18 L88 34 L70 58 L48 42 Z" class="f-crimson" />
							<path d="M138 18 L112 34 L130 58 L152 42 Z" class="f-crimson" />
							<path d="M64 26 L80 36 L69 50 L55 40 Z" class="f-petal" />
							<path d="M136 26 L120 36 L131 50 L145 40 Z" class="f-petal" />
						</g>
						<g class="cut"><path d="M100 30 L134 48 L138 86 L114 108 L86 108 L62 86 L66 48 Z" class="f-cream" /></g>
						<g class="cut"><path d="M76 110 L124 110 L142 150 L118 174 L82 174 L58 150 Z" class="f-cream-deep" /></g>
						<g class="cut sano-tail">
							<path d="M140 152 L172 140 L160 158 L176 166 L142 164 Z" class="f-crimson" />
						</g>
						<circle cx="88" cy="72" r="4.4" class="f-ink" />
						<circle cx="112" cy="72" r="4.4" class="f-ink" />
						<path d="M94 88 L106 88 L100 96 Z" class="f-crimson" />
						<path d="M70 80 L56 76 M70 86 L57 88 M130 80 L144 76 M130 86 L143 88" class="s-whisker" />
					</g>
				</svg>
				<h2 id="complete-title">Lesson complete!</h2>
				<p id="complete-streak" class="hide">
					<span class="icon"
						><svg><use href="#i-bolt" /></svg></span
					><span id="complete-streak-text"></span>
				</p>
				<p id="complete-stats"></p>
				<p id="complete-strengthened" class="hide"></p>
				<button id="complete-continue">Continue</button>
			</div>

			<div id="screen-dictionary" class="hide">
				<p><a id="home-link">← Back to lessons</a></p>

				<table id="words">
					<thead>
						<tr class="header">
							<th>Word</th>
							<th>Pronunciation</th>
							<th>Meaning</th>
							<th>Usage</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>

				<table id="vocab">
					<thead>
						<tr class="header">
							<th>Nepali Word</th>
							<th>Pronunciation</th>
							<th>Icon</th>
							<th>English Word</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>

			<div id="flashcard" class="hide">
				<a id="flashcard-prev" class="icon" role="button" aria-label="Previous card"
					><svg><use href="#i-navigate_before" /></svg
				></a>
				<div id="flashcard-content">
					<div id="flashcard-card">
						<div id="flashcard-front">
							<div id="flashcard-word"></div>
							<div id="flashcard-pronounce"></div>
							<p id="flashcard-hint">Tap to reveal</p>
						</div>
						<div id="flashcard-back">
							<div id="flashcard-meaning"></div>
							<div id="flashcard-usage"></div>
						</div>
					</div>
				</div>
				<div id="quiz-content">
					<div id="quiz-word"></div>
					<div id="quiz-pronounce"></div>
					<ol id="quiz-choices">
						<li><button id="quiz-choice-1"></button></li>
						<li><button id="quiz-choice-2"></button></li>
						<li><button id="quiz-choice-3"></button></li>
						<li><button id="quiz-choice-4"></button></li>
					</ol>
				</div>
				<a id="flashcard-next" class="icon" role="button" aria-label="Next card"
					><svg><use href="#i-navigate_next" /></svg
				></a>
				<a id="flashcard-close" class="icon" role="button" aria-label="Close"
					><svg><use href="#i-close" /></svg
				></a>
			</div>

			<p class="footer">
				<svg class="sano-head" viewBox="46 16 108 94" aria-hidden="true">
					<path d="M62 18 L88 34 L70 58 L48 42 Z" class="f-crimson" />
					<path d="M138 18 L112 34 L130 58 L152 42 Z" class="f-crimson" />
					<path d="M64 26 L80 36 L69 50 L55 40 Z" class="f-petal" />
					<path d="M136 26 L120 36 L131 50 L145 40 Z" class="f-petal" />
					<path d="M100 30 L134 48 L138 86 L114 108 L86 108 L62 86 L66 48 Z" class="f-cream" />
					<circle cx="88" cy="72" r="6" class="f-ink" />
					<circle cx="112" cy="72" r="6" class="f-ink" />
					<path d="M93 88 L107 88 L100 97 Z" class="f-crimson" />
				</svg>
				&copy; 2026 Ross Harmes
			</p>
		</div>
	</body>
</html>
