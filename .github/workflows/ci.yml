# Static checks on every push to main and every PR: Prettier formatting, stamp
# freshness, PHP syntax (php -l), and JS syntax (node --check) — i.e. `npm run
# lint` (tools/check.sh --no-viewports). The headless-Chrome viewport check
# (`npm test`) is skipped here since CI has no browser; run it locally.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ubuntu-latest ships a PHP CLI; `php -l` (syntax only) doesn't need a
      # specific version. Add shivammathur/setup-php to pin one if that changes.
      - run: php --version
      - run: npm install
      - run: npm run lint
