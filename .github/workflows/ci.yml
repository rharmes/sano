# CI for the sano test suite. Three jobs:
#  - unit:        static checks + node:test (logic + data) + the PHP helper test + the
#                 Playwright api/ guard specs (no browser, no DB).
#  - e2e:         Playwright UI specs in real Chromium + WebKit.
#  - integration: Playwright api/ specs against a MySQL service (full request cycle).
# All headless browser work runs here now (the old viewport/webkit harnesses were retired);
# real iOS-device Safari checks remain manual.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here writes to the repo, and a token that cannot
# push is one less thing a compromised action in the dependency tree can use.
permissions:
  contents: read

jobs:
  unit:
    name: static + unit + data + api guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - run: npm install
      - name: Static checks (Prettier, stamps, php -l, node --check)
        run: npm run lint
      - name: Unit + data tests (node:test)
        run: node --test tests/unit/*.test.mjs tests/data/*.test.mjs
      - name: PHP pure-helper test
        run: php tests/api/helpers.test.php
      - name: API guard specs (Playwright request — no browser, no DB)
        run: npx playwright test tests/api

  e2e:
    name: e2e (Chromium + WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E specs
        run: npx playwright test tests/e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: api integration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sano
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - run: npm install
      - name: Load the schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot sano < tools/schema.sql
      - name: Write a test sano-config.php (one level above the checkout)
        run: |
          cat > "$GITHUB_WORKSPACE/../sano-config.php" <<'PHP'
          <?php return [
            'dsn' => 'mysql:host=127.0.0.1;port=3306;dbname=sano;charset=utf8mb4',
            'user' => 'root',
            'pass' => 'root',
          ];
          PHP
      - name: API integration specs
        env:
          SANO_TEST_DB: '1'
          # The whole suite registers and logs in from one IP (127.0.0.1); lift both per-IP
          # caps so the 5/hour signup throttle and the 30/window login throttle don't starve
          # later tests. Prod sets neither, so the defaults (5 and 30) hold there.
          SANO_SIGNUPS_PER_HOUR: '100000'
          SANO_LOGIN_IP_MAX: '100000'
        run: npx playwright test tests/api
      - name: Admin read-path specs (seeded admin account + traffic rows)
        env:
          SANO_TEST_DB: '1'
          SANO_ADMIN_SEED: '1'
          SANO_SIGNUPS_PER_HOUR: '100000'
          SANO_LOGIN_IP_MAX: '100000'
          SANO_PORT: '8125'
        # admin-users.php's success path and all of admin-traffic.php were only ever
        # reached for their 403. They read every value back out of MySQL, so they are the
        # paths most exposed to strict_types and native prepares (T54) — and the ones a
        # local run can never touch, since there is no local database.
        run: |
          php tests/fixtures/seed-admin.php
          npx playwright test tests/api --grep @admin

      - name: Login rate-limit spec (needs the whole per-IP budget to itself)
        env:
          SANO_TEST_DB: '1'
          SANO_SIGNUPS_PER_HOUR: '100000'
          # Small on purpose: this spec proves that probing a locked account consumes the
          # prober's budget, which can only be observed by exhausting it. One bucket serves
          # every test, so it runs alone, against a table cleared of the run above.
          SANO_LOGIN_IP_MAX: '14'
          # Its own port: this starts a second php -S, and reusing the one the step above
          # just tore down is a bind race with nothing to gain.
          SANO_PORT: '8124'
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot sano -e 'DELETE FROM login_attempts'
          npx playwright test tests/api --grep @ip-throttle
